name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Prepare wrapper
        shell: bash
        run: chmod +x mvnw
      - name: Style and static checks
        shell: bash
        run: ./mvnw -q spotless:check checkstyle:check spotbugs:check
      - name: Test and package
        shell: bash
        run: ./mvnw -q test package

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t java-stakeholder .
      - name: Smoke test
        run: docker run --rm java-stakeholder --list-values
